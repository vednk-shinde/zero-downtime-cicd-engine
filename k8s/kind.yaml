kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, protocol: TCP }  # blue-green service
      - { containerPort: 30081, hostPort: 8081, protocol: TCP }  # canary service
